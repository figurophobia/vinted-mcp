name: Release

# Push a tag like v0.2.0 (matching VERSION in vinted_mcp/config.py) to publish
# to PyPI and attach standalone executables to a GitHub release.
#
# PyPI uses trusted publishing: register this repository + workflow
# (release.yml, environment "pypi") as a trusted publisher of the
# "vinted-mcp" project on pypi.org; no API token is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import re;print(re.search(r'^VERSION = \"(.+)\"', open('vinted_mcp/config.py').read(), re.M).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_package.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-arm64
          - os: windows-latest
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executables
        run: |
          python -m pip install '.[build]'
          python scripts/build_binary.py
      - name: Archive
        shell: bash
        run: |
          cd dist/bin
          name="vinted-mcp-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../../$name.zip" vinted-mcp.exe vinted.exe
          else
            tar czf "../../$name.tar.gz" vinted-mcp vinted
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.suffix }}
          path: vinted-mcp-*

  pypi:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vinted-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            artifacts/dist/* artifacts/bin-*/*
