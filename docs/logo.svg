<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="vinted-mcp">
  <title>vinted-mcp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F8F9"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09B1BA"/>
      <stop offset="1" stop-color="#007782"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2B30" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="40" fill="url(#bg)" stroke="#09B1BA" stroke-opacity=".25" stroke-width="2"/>

  <!-- marketplace tile -->
  <g transform="translate(70,58)" filter="url(#shadow)">
    <rect width="168" height="168" rx="42" fill="url(#tile)"/>
    <path d="M-34 -30 L0 32 L34 -30" transform="translate(84,84)" fill="none" stroke="#FFFFFF" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- link between the tiles -->
  <g fill="none" stroke="#007782" stroke-width="10" stroke-linecap="round">
    <path d="M232 178 C 262 178, 262 214, 292 214"/>
    <circle cx="232" cy="178" r="7" fill="#007782"/>
    <circle cx="292" cy="214" r="7" fill="#007782"/>
  </g>

  <!-- MCP connector tile -->
  <g transform="translate(286,130)" filter="url(#shadow)">
    <rect width="132" height="132" rx="34" fill="#16181D"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(66,66)">
      <path d="M-34 6 L4 -32 A15 15 0 0 1 25 -11 L-8 22"/>
      <path d="M-19 21 L14 -12 A15 15 0 0 1 35 9 L6 38"/>
      <path d="M-30 -14 L-6 -38"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="478" y="150" font-size="92" font-weight="800" letter-spacing="-2">
      <tspan fill="#09B1BA">vinted</tspan><tspan fill="#16181D">-mcp</tspan>
    </text>
    <text x="482" y="196" font-size="26" font-weight="500" fill="#3D4A4F">MCP server · CLI · Python client for Vinted</text>
    <g transform="translate(482,226)"><g transform="translate(0,0)"><rect width="89" height="36" rx="18" fill="#FFFFFF" stroke="#09B1BA" stroke-opacity=".45"/><text x="45" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#007782">search</text></g><g transform="translate(99,0)"><rect width="89" height="36" rx="18" fill="#FFFFFF" stroke="#09B1BA" stroke-opacity=".45"/><text x="45" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#007782">offers</text></g><g transform="translate(198,0)"><rect width="67" height="36" rx="18" fill="#FFFFFF" stroke="#09B1BA" stroke-opacity=".45"/><text x="33" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#007782">chat</text></g><g transform="translate(275,0)"><rect width="112" height="36" rx="18" fill="#FFFFFF" stroke="#09B1BA" stroke-opacity=".45"/><text x="56" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#007782">listings</text></g><g transform="translate(397,0)"><rect width="201" height="36" rx="18" fill="#FFFFFF" stroke="#09B1BA" stroke-opacity=".45"/><text x="101" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#007782">agent automation</text></g></g>
  </g>
</svg>
